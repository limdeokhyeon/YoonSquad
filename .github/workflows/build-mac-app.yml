name: Build macOS app

on:
  push:
    branches: [claude/eager-gates-2jfxuc, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests
      - name: Build app
        run: ./build_app.sh
      - name: Smoke test (앱이 뜨자마자 죽지 않는지)
        run: |
          dist/PhotoSort.app/Contents/MacOS/PhotoSort &
          pid=$!
          sleep 6
          kill -0 "$pid" && kill "$pid"
      - name: Zip app (실행 권한 보존)
        run: ditto -c -k --keepParent dist/PhotoSort.app PhotoSort-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSort-mac
          path: PhotoSort-mac.zip
      - name: Publish to Releases (latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PhotoSort-mac.zip \
            --title "PhotoSort (latest build)" \
            --notes "최신 맥용 앱입니다. PhotoSort-mac.zip을 받아 압축을 풀고 PhotoSort.app을 응용 프로그램 폴더로 옮기세요." \
            --target "$GITHUB_SHA"
